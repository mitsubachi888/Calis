<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Calis">
<meta name="theme-color" content="#16202A">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Calisthenics Cá Nhân</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone app — tab views over a bottom bar; full-screen workout player and exercise sheet on top. */
:root{
  --bg:#ECEEEA; --surface:#FFFFFF; --sunk:#E3E6E1; --ink:#17212B; --muted:#5A6570; --line:#D6DBD3;
  --accent:#D4461B; --accent-soft:#F8E0D6; --on-accent:#FFFFFF;
  --ok:#2B7A69; --ok-soft:#D6ECE6; --warn:#A86A12; --warn-soft:#F6E7C8;
  --hero:#16202A; --on-hero:#ECEEEA; --hero-sub:#9AA6B0; --hero-panel:#202C37;
  --fig:#17212B; --fig2:#9AA4AC; --figbg:#E3E6E1; --prop:#C6CCC3; --prop-l:#A9B0A5; --hl-far:#E9A48C; --band:#2B7A69;
  --c-chest:#D4461B; --c-arms:#13897A; --c-back:#2F6FD6; --c-legs:#6B8E0E; --c-core:#7A55E0; --bad:#C8352B; --on-sc:#FFFFFF;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1216; --surface:#161F27; --sunk:#1D2832; --ink:#E7ECEA; --muted:#93A0A9; --line:#25313B;
  --accent:#FF6B3F; --accent-soft:#3A2017; --on-accent:#1A0C06;
  --ok:#4DB59E; --ok-soft:#14302A; --warn:#E3AA4E; --warn-soft:#352813;
  --c-chest:#FF6B3F; --c-arms:#2FC2AE; --c-back:#5B9BFF; --c-legs:#C5E34A; --c-core:#A88BFF; --bad:#FF5A4E; --on-sc:#14100C;
  --hero:#1B2631; --on-hero:#E7ECEA; --hero-sub:#93A0A9; --hero-panel:#243240;
  --fig:#E7ECEA; --fig2:#5E6B75; --figbg:#1D2832; --prop:#33414C; --prop-l:#45535E; --hl-far:#8C3E26; --band:#4DB59E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1216; --surface:#161F27; --sunk:#1D2832; --ink:#E7ECEA; --muted:#93A0A9; --line:#25313B;
  --accent:#FF6B3F; --accent-soft:#3A2017; --on-accent:#1A0C06;
  --ok:#4DB59E; --ok-soft:#14302A; --warn:#E3AA4E; --warn-soft:#352813;
  --c-chest:#FF6B3F; --c-arms:#2FC2AE; --c-back:#5B9BFF; --c-legs:#C5E34A; --c-core:#A88BFF; --bad:#FF5A4E; --on-sc:#14100C;
  --hero:#1B2631; --on-hero:#E7ECEA; --hero-sub:#93A0A9; --hero-panel:#243240;
  --fig:#E7ECEA; --fig2:#5E6B75; --figbg:#1D2832; --prop:#33414C; --prop-l:#45535E; --hl-far:#8C3E26; --band:#4DB59E; color-scheme:dark}

*{box-sizing:border-box;touch-action:manipulation}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
input,textarea,select{font-size:16px!important}
button,.btn,.srow,.tabs button{-webkit-user-select:none;user-select:none}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:inherit}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(100px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.02}
h1{font-size:2.3rem}
h2{font-size:1.6rem}
h3{font-size:1.2rem;line-height:1.15;text-wrap:pretty}
p{margin:0}
.eyebrow{font-size:.7rem;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.num{font-variant-numeric:tabular-nums}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:6px}
.sec-h h2{font-size:1.45rem}

/* Figures */
svg.fig{display:block;width:100%;height:auto;background:var(--figbg)}
.f-floor{stroke:var(--prop);stroke-width:2}
.f-prop{fill:var(--prop)}
.f-prop-l{stroke:var(--prop-l);stroke-width:3;stroke-linecap:round}
.f-wall{stroke:var(--prop-l);stroke-width:4}
.f-far{stroke:var(--fig2);stroke-width:6;stroke-linecap:round}
.f-near{stroke:var(--fig);stroke-width:7;stroke-linecap:round}
.f-torso{stroke:var(--fig);stroke-width:12;stroke-linecap:round}
.f-head{fill:var(--fig)}
.f-hl{stroke:var(--accent);stroke-width:12;stroke-linecap:round}
.f-hl-limb{stroke:var(--accent);stroke-width:7;stroke-linecap:round}
.f-hl-far{stroke:var(--hl-far);stroke-width:6;stroke-linecap:round}
.f-hl-dot{fill:var(--accent)}
.f-band{fill:none;stroke:var(--band);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.thumb{flex:none;width:72px;border-radius:12px;overflow:hidden}
.thumb.sm{width:52px;border-radius:10px}

/* Home header */
.hello{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:4px}
.hello .hi{font-size:.92rem;color:var(--muted);font-weight:500}
.hello h1{font-size:2.6rem;margin-top:2px}
.avatar{flex:none;width:48px;height:48px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.5rem}

/* Hero */
.hero{position:relative;background:var(--hero);color:var(--on-hero);border-radius:22px;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr)}
.hero-top{position:relative;padding:18px 18px 0;min-height:172px}
.hero-top .txt{position:relative;z-index:1}
.hero-top .chips{max-width:56%}
.hero-art{position:absolute;right:-2px;bottom:-4px;width:48%}
.hero .eyebrow{color:var(--hero-sub)}
.hero h2{font-size:2.35rem;margin-top:6px}
.hero .fig{--figbg:transparent;--fig:var(--on-hero);--fig2:#55626D;--prop:#34424E;--prop-l:#4A5866;--hl-far:#8C3E26}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{font-size:.76rem;font-weight:600;border-radius:999px;padding:4px 10px;background:var(--hero-panel);color:var(--on-hero)}
.hero-bottom{padding:14px 18px 18px;display:flex;flex-direction:column;gap:12px}
.hero-ex{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.hero-ex .thumb{width:auto;border-radius:10px;--figbg:var(--hero-panel);--fig:var(--on-hero);--fig2:#55626D;--prop:#34424E;--prop-l:#4A5866;--hl-far:#8C3E26}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:13px 18px;font-weight:600;min-height:50px;text-align:center}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-ghost{background:var(--sunk);color:var(--ink)}
.btn-line{border:1px solid var(--line);background:var(--surface)}
.btn-block{width:100%}
.btn svg{width:20px;height:20px}

/* Week strip */
.weekbar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.72rem;color:var(--muted);font-weight:600}
.day i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);font-style:normal;color:var(--muted);font-size:.8rem}
.day.done i{background:var(--accent);color:var(--on-accent)}
.day.today i{box-shadow:0 0 0 2px var(--ink) inset}
.day.today{color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-family:var(--display);font-size:1.9rem;line-height:1;font-weight:700}
.stat span{font-size:.74rem;color:var(--muted);line-height:1.3;display:block;margin-top:4px}

.notice{border-radius:14px;padding:11px 14px;font-size:.9rem;display:flex;gap:10px;align-items:flex-start}
.notice::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;margin-top:7px}
.notice.warn{background:var(--warn-soft)}.notice.warn::before{background:var(--warn)}
.notice.info{background:var(--ok-soft)}.notice.info::before{background:var(--ok)}

/* Program cards */
.prog{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;width:100%}
.prog .thumb{width:96px}
.prog .tag{font-family:var(--display);font-weight:700;color:var(--accent);font-size:.95rem;letter-spacing:.04em}
.prog h3{font-size:1.35rem}
.prog small{color:var(--muted);font-size:.8rem}
.prog .go{margin-left:auto;color:var(--muted);flex:none;padding-right:4px}

/* Preview */
.backbar{display:flex;align-items:center;gap:10px}
.iconbtn{width:44px;height:44px;border-radius:50%;background:var(--sunk);display:inline-flex;align-items:center;justify-content:center;flex:none}
.iconbtn svg{width:22px;height:22px}
.blk-h{display:flex;align-items:baseline;gap:8px;margin:6px 2px 8px}
.blk-h b{font-family:var(--display);font-size:1.15rem}
.blk-h span{font-size:.8rem;color:var(--muted)}
.exrow{display:flex;gap:12px;align-items:center;padding:8px;border-radius:14px;background:var(--surface);border:1px solid var(--line);width:100%}
.exrow + .exrow{margin-top:8px}
.exrow .lbl{font-family:var(--display);font-weight:700;color:var(--accent);font-size:.9rem}
.exrow .nm{font-weight:600;line-height:1.25}
.exrow .ds{font-size:.82rem;color:var(--muted)}
.exrow > div{min-width:0}
.sticky-cta{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom,0px));margin-top:8px}

/* Library */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.lcard .fig{border-radius:0}
.lcard div{padding:10px 12px 12px}
.lcard b{display:block;line-height:1.25;font-size:.92rem}
.lcard small{color:var(--muted);font-size:.76rem}
.pill{display:inline-block;font-size:.7rem;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--accent-soft);color:var(--accent)}

/* History */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.hcard + .hcard{margin-top:10px}
.hcard .hrow{display:flex;gap:10px;align-items:center;margin-top:10px}
.hcard .hrow b{font-weight:600;font-size:.9rem;display:block;line-height:1.2}
.hcard .hrow span{font-size:.82rem;color:var(--muted)}
.cmp{width:100%;border-collapse:collapse;margin-top:8px}
.cmp td,.cmp th{padding:6px 0;border-bottom:1px solid var(--line);text-align:right;font-weight:500}
.cmp td:first-child,.cmp th:first-child{text-align:left}

/* Settings */
textarea{width:100%;min-height:100px;border:1px solid var(--line);border-radius:10px;background:var(--sunk);color:var(--ink);font:12px/1.4 ui-monospace,Menlo,monospace;padding:10px}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px}
.switch input{width:22px;height:22px;accent-color:var(--accent)}
input[type=text]{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--sunk);color:var(--ink);font:inherit;padding:10px 12px}

/* Tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:.72rem;color:var(--muted);font-weight:500;text-align:center}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--accent)}

/* Sheet (exercise detail) */
.overlay{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.overlay .inner{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.bigfig{border-radius:20px;overflow:hidden;border:1px solid var(--line)}
.mus{display:flex;flex-wrap:wrap;gap:6px}
.mus span{font-size:.78rem;font-weight:600;border-radius:999px;padding:4px 10px;background:var(--accent-soft);color:var(--accent)}
.ladder{display:flex;flex-direction:column;gap:6px}
.ladder button{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);display:flex;justify-content:space-between;gap:10px;align-items:center}
.ladder button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.ladder button[aria-pressed="true"]::after{content:"Đang tập";font-size:.72rem;font-weight:700;color:var(--accent)}
ol.cue{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}

/* Player */
.player{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding:calc(8px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.player[data-phase="work"]{--ph:var(--accent);--ph-soft:var(--accent-soft)}
.player[data-phase="rest"],.player[data-phase="transit"]{--ph:var(--ok);--ph-soft:var(--ok-soft)}
.player[data-phase="warm"],.player[data-phase="stretch"],.player[data-phase="prep"]{--ph:var(--muted);--ph-soft:var(--sunk)}
.pinner{max-width:560px;width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column;min-height:0}
.ptop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ptop .ttl{text-align:center;font-size:.8rem;color:var(--muted);line-height:1.2}
.ptop .ttl b{display:block;color:var(--ink);font-size:.95rem}
.pprog{height:4px;border-radius:4px;background:var(--sunk);overflow:hidden;margin-top:8px}
.pprog i{display:block;height:100%;background:var(--ph);transition:width .3s}
.pfig{position:relative;margin-top:10px;border-radius:20px;overflow:hidden;border:1px solid var(--line);flex:none}
.pfig .fig{height:clamp(130px,27vh,270px);width:100%}
.pfig .ov{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap}
.phase{font-weight:700;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ph);background:var(--ph-soft);padding:4px 10px;border-radius:999px}
.pnx{font-size:.85rem;color:var(--muted);margin-top:8px;text-align:center;line-height:1.35}
.pnx b{color:var(--ink)}
.pbody{flex:1;display:flex;flex-direction:column;justify-content:center;gap:10px;min-height:0;padding:10px 0;text-align:center;align-items:center}
.pname{font-family:var(--display);font-size:2.1rem;font-weight:700;line-height:1.02;text-wrap:balance}
.psub{color:var(--muted);font-weight:500;font-size:.92rem}
.psub b{color:var(--accent)}
.bigtime{font-family:var(--display);font-weight:800;font-size:clamp(4.2rem,20vw,6rem);line-height:.95;font-variant-numeric:tabular-nums}
.tbar{width:100%;max-width:340px;height:8px;border-radius:8px;background:var(--sunk);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--ph);width:0}
.sets{width:100%;max-width:360px;display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:10px;padding:7px 10px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:.9rem;text-align:left}
.set .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);font-weight:700;font-size:.8rem}
.set.done{background:var(--ok-soft);border-color:transparent}
.set.done .n{background:var(--ok);color:var(--surface)}
.set.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.set.cur .n{background:var(--accent);color:var(--on-accent)}
.set .v{font-weight:600}
.set .h{color:var(--muted);font-size:.8rem}
.reps{display:flex;align-items:center;gap:18px}
.reps button{width:56px;height:56px;border-radius:50%;background:var(--sunk);font-size:1.8rem;font-weight:600;text-align:center}
.reps output{font-family:var(--display);font-size:4.4rem;font-weight:800;min-width:2ch;line-height:1;font-variant-numeric:tabular-nums;text-align:center}
.pctl{display:grid;grid-template-columns:1fr 1.7fr 1fr;gap:10px}
.pctl .btn{min-height:58px}
.mini{font-size:.82rem;padding:6px 12px;border-radius:999px;background:var(--sunk);font-weight:600;min-height:0}
.sheet{position:absolute;inset:auto 0 0 0;background:var(--surface);border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px;box-shadow:0 -10px 30px rgba(0,0,0,.2)}
.flag{display:flex;flex-direction:column;gap:8px;background:var(--accent-soft);border-radius:14px;padding:12px 14px}

/* ===== v1.3: color system ===== */
.avatar{border:0;cursor:pointer;background:linear-gradient(135deg,var(--c-chest),var(--c-core));color:#fff}
.avatar.lg{width:60px;height:60px;font-size:1.9rem;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800}
.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px 6px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.7rem;color:var(--muted);font-weight:600}
.day i{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:.82rem;color:var(--muted);border:2.5px solid var(--line);background:none;box-shadow:none}
.day i svg{width:18px;height:18px}
.day.done i{border-color:var(--dc);background:color-mix(in srgb,var(--dc) 22%,transparent);color:var(--dc)}
.day.today span{color:var(--ink)}
.day.today i{border-color:var(--ink);color:var(--ink);font-weight:700}
.day.today.done i{border-color:var(--dc);color:var(--dc)}
.hero{background:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--sc) 42%,transparent),transparent 62%),linear-gradient(160deg,var(--hero) 40%,color-mix(in srgb,var(--sc) 18%,var(--hero)));}
.hero-kicker{display:flex;align-items:center;gap:7px;font-size:.7rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--hero-sub)}
.hero-kicker .dot{width:8px;height:8px;border-radius:50%;background:var(--sc);box-shadow:0 0 0 4px color-mix(in srgb,var(--sc) 25%,transparent)}
.hero .chips{margin-top:8px}
.chip.g{background:color-mix(in srgb,var(--gc) 22%,transparent);color:color-mix(in srgb,var(--gc) 70%,#fff)}
.hero .fig{--hl-far:color-mix(in srgb,var(--accent) 45%,var(--hero))}

const lerp=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
function seg(l,a,b){l.setAttribute('x1',a[0].toFixed(1));l.setAttribute('y1',a[1].toFixed(1));l.setAttribute('x2',b[0].toFixed(1));l.setAttribute('y2',b[1].toFixed(1))}
function draw(f,t){
  const {A,B,P}=f.C,J={};for(const k in A)J[k]=lerp(A[k],B[k],t);
  const L=f.L;
  seg(L.ua2,J.s,J.e2);seg(L.fa2,J.e2,J.w2);seg(L.th2,J.p,J.k2);seg(L.sh2,J.k2,J.a2);seg(L.ft2,J.a2,J.t2);
  seg(L.torso,J.p,J.s);L.head.setAttribute('cx',J.h[0].toFixed(1));L.head.setAttribute('cy',J.h[1].toFixed(1));
  seg(L.ua,J.s,J.e);seg(L.fa,J.e,J.w);seg(L.th,J.p,J.k);seg(L.sh,J.k,J.a);seg(L.ft,J.a,J.t);

  if(L.band){const pts=P.band.map(r=>typeof r==='string'?J[r]:typeof r[0]==='string'?[J[r[0]][0]+r[1],J[r[0]][1]+r[2]]:r);L.band.setAttribute('points',pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' '))}
}

function reps(ex,lo,hi,set,of,o={}){return Object.assign({t:'reps',ex,lo,hi,set,of,phase:'work'},o)}
function superset(items,rounds,rest,tag){
  const out=[];
  for(let r=1;r<=rounds;r++){
    items.forEach((it,i)=>{
      const lab=tag+(i+1);
      if(it.hold){
        if(it.sides){out.push(timer(it.ex,it.hold,'work',{set:r,of:rounds,tag:lab,side:'bên trái'}));out.push(timer(null,5,'transit',{label:'Đổi bên'}));out.push(timer(it.ex,it.hold,'work',{set:r,of:rounds,tag:lab,side:'bên phải'}))}
        else out.push(timer(it.ex,it.hold,'work',{set:r,of:rounds,tag:lab}));
      } else out.push(reps(it.ex,it.lo,it.hi,r,rounds,{tag:lab,unit:it.unit}));
      if(i<items.length-1) out.push(timer(null,8,'transit',{label:'Chuyển bài'}));
    });
    out.push(timer(null,rest,'rest',{label:'Nghỉ'}));
  }
  return out;
}
function interval(list,work,rest){
  const out=[];list.forEach((ex,i)=>{out.push(timer(ex,work,'work',{tag:'F',set:i+1,of:list.length,fin:true}));if(i<list.length-1)out.push(timer(null,rest,'rest',{label:'Nghỉ'}))});return out;
}

  if(!S.sessions.length)return 'T';
  const lastT=lastOf('T');

  const l=lastTrain();return !l||l.type==='B'?'A':'B';
}

/* ============ Muscle groups & weekly volume ============ */
const GROUPS=[
  {k:'chest',n:'Ngực',c:'var(--c-chest)'},
  {k:'arms',n:'Tay',c:'var(--c-arms)'},
  {k:'back',n:'Lưng',c:'var(--c-back)'},
  {k:'legs',n:'Chân',c:'var(--c-legs)'},
  {k:'core',n:'Bụng',c:'var(--c-core)'}];
const GOF={bandPush:'chest',deficit:'chest',diamond:'chest',wide:'chest',decline:'chest',standard:'chest',maxPush:'chest',
  dips:'arms',curl:'arms',ohExt:'arms',bandRow:'back',
  split:'legs',bandSquat:'legs',slBridge:'legs',wallSit:'legs',squat60:'legs',
  deadBug:'core',hollow:'core',sidePlank:'core',slowMC:'core',shTap:'core',revCrunch:'core',plankMax:'core'};
const gColor=k=>(GROUPS.find(g=>g.k===k)||{}).c||'var(--accent)';
const gName=k=>(GROUPS.find(g=>g.k===k)||{}).n||'';
const SCOL={A:'var(--c-chest)',B:'var(--c-legs)',T:'var(--c-core)'};
function countWork(steps){const v={};for(const s of steps){if(!s.ex||s.test||s.phase!=='work'||s.t==='watch')continue;const g=GOF[s.ex];if(g)v[g]=(v[g]||0)+1}return v}
const TARGET=(()=>{const a=countWork(SESS.A.steps()),b=countWork(SESS.B.steps()),o={};GROUPS.forEach(g=>o[g.k]=(a[g.k]||0)+(b[g.k]||0));return o})();
const TARGET_SUM=Object.values(TARGET).reduce((a,b)=>a+b,0);
function sessVol(s){if(s.vol)return s.vol;const v={};s.sets.forEach(x=>{if(x.test)return;const g=GOF[x.ex];if(g)v[g]=(v[g]||0)+1});return v}
function volBetween(list,a,b){const v={};list.filter(s=>s.date>=a&&s.date<b).forEach(s=>{const sv=sessVol(s);for(const k in sv)v[k]=(v[k]||0)+sv[k]});return v}

/* 8-week phases */
const PHASES=[{from:1,to:2,n:'Làm quen',c:'var(--c-arms)'},{from:3,to:5,n:'Tăng tải',c:'var(--c-chest)'},{from:6,to:7,n:'Biến thể khó',c:'var(--c-core)'},{from:8,to:8,n:'Kiểm tra',c:'var(--c-legs)'}];
const phaseOf=w=>PHASES.find(p=>w>=p.from&&w<=p.to)||PHASES[0];
function phaseTrack(w){
  return `<div class="ptrack" role="img" aria-label="Tuần ${w} trên 8, giai đoạn ${phaseOf(w).n}">${[1,2,3,4,5,6,7,8].map(i=>{const p=phaseOf(i);return `<span class="pseg${i<w?' past':''}${i===w?' now':''}" style="--pc:${p.c}"><i>${i}</i></span>`}).join('')}</div>
  <div class="plegend">${PHASES.map(p=>`<span style="--pc:${p.c}"${phaseOf(w)===p?' class="on"':''}>${p.n}</span>`).join('')}</div>`;
}

/* Weekly ring (Fitbod-style segmented target) */
function weekRing(v,size=148){
  const R=54,C=2*Math.PI*R,gap=6;let off=0,done=0;
  const segs=GROUPS.map(g=>{const t=TARGET[g.k]||0;if(!t)return'';const len=C*t/TARGET_SUM-gap,d=Math.min(v[g.k]||0,t);done+=d;
    const s=`<circle r="${R}" cx="70" cy="70" fill="none" stroke="${g.c}" stroke-opacity=".22" stroke-width="12" stroke-dasharray="${len.toFixed(1)} ${C}" stroke-dashoffset="${(-off).toFixed(1)}"/>`+
      (d?`<circle r="${R}" cx="70" cy="70" fill="none" stroke="${g.c}" stroke-width="12" stroke-linecap="butt" stroke-dasharray="${(len*d/t).toFixed(1)} ${C}" stroke-dashoffset="${(-off).toFixed(1)}"/>`:'');
    off+=len+gap;return s}).join('');
  const pct=Math.round(100*done/TARGET_SUM);
  return `<svg class="ring" viewBox="0 0 140 140" width="${size}" height="${size}" role="img" aria-label="Đã xong ${pct}% số hiệp tuần này"><g transform="rotate(-90 70 70)">${segs}</g>
    <text x="70" y="72" text-anchor="middle" class="ring-n">${pct}%</text><text x="70" y="92" text-anchor="middle" class="ring-l">hiệp tuần này</text></svg>`;
}
function groupRows(v){
  return GROUPS.map(g=>{const t=TARGET[g.k],d=Math.min(v[g.k]||0,t);return `<div class="grow" style="--gc:${g.c}"><span class="gdot"></span><b>${g.n}</b><span class="gbar"><i style="width:${(100*d/t).toFixed(0)}%"></i></span><span class="num gval">${v[g.k]||0}<small>/${t}</small></span></div>`}).join('');
}

/* ============ Progress ============ */
function sampleSessions(){
  const out=[],now=startOfDay(Date.now()),DAYS=[40,37,33,30,26,23,19,16,12,9,5,2];
  out.push({type:'T',date:now-43*DAY+18*3600e3,dur:690,sets:[],test:{maxPush:38,plankMax:95,squat60:41}});
  DAYS.forEach((d,i)=>{const A=i%2===0,date=now-d*DAY+18*3600e3,p=Math.floor(i/2);
    if(A){const r=[[12,11,10,9],[12,11,10,10],[12,12,11,10],[12,12,12,11],[9,9,8,8],[10,9,9,9]][p];
      out.push({type:'A',date,dur:1750+i*10,lvl:{bandPush:p>=4?1:0},sets:r.map((x,j)=>({ex:'bandPush',name:'Push-up có dây',set:j+1,reps:x,hi:12,of:4})).concat([13,12,12].map((x,j)=>({ex:'deficit',name:'Deficit push-up',set:j+1,reps:x+Math.min(p,3),hi:15,of:3}))),
        vol:{chest:7+Math.min(p,4),arms:p>2?9:7,back:4}});
    } else out.push({type:'B',date,dur:1620,sets:[10,10,9].map((x,j)=>({ex:'split',name:'Bulgarian split squat',set:j+1,reps:x+Math.min(p,2),hi:12,of:3})),vol:{legs:8+Math.min(p,2),core:10+Math.min(p,4)}});
  });
  out.push({type:'T',date:now-1*DAY+18*3600e3,dur:700,sets:[],test:{maxPush:46,plankMax:128,squat60:47}});
  return out;
}
function stackedWeeks(list){
  const W=330,H=170,p={l:26,r:6,t:12,b:24},n=8,m0=monday()-(n-1)*7*DAY;
  const weeks=[...Array(n)].map((_,i)=>volBetween(list,m0+i*7*DAY,m0+(i+1)*7*DAY));
  const tot=weeks.map(v=>Object.values(v).reduce((a,b)=>a+b,0));
  const top=Math.max(TARGET_SUM,...tot);const ymax=Math.ceil(top/10)*10;
  const bw=(W-p.l-p.r)/n,Y=v=>p.t+(H-p.t-p.b)*(1-v/ymax);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Số hiệp mỗi tuần theo nhóm cơ, 8 tuần gần nhất">`;
  [0,ymax/2,ymax].forEach(t=>{s+=`<line x1="${p.l}" x2="${W-p.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)"/><text x="${p.l-6}" y="${Y(t)+4}" text-anchor="end">${t}</text>`});
  s+=`<line x1="${p.l}" x2="${W-p.r}" y1="${Y(TARGET_SUM)}" y2="${Y(TARGET_SUM)}" stroke="var(--ink)" stroke-dasharray="3 4" stroke-opacity=".5"/><text x="${W-p.r}" y="${Y(TARGET_SUM)-5}" text-anchor="end" style="fill:var(--ink)">mục tiêu ${TARGET_SUM}</text>`;
  weeks.forEach((v,i)=>{let y=Y(0);const x=p.l+i*bw+bw*0.2,w=bw*0.6;
    if(!tot[i])s+=`<rect x="${x}" y="${Y(0)-3}" width="${w}" height="3" rx="1.5" fill="var(--line)"/>`;
    GROUPS.forEach(g=>{const c=v[g.k]||0;if(!c)return;const h=Y(0)-Y(c);y-=h;s+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(0,h-1.5).toFixed(1)}" rx="2" fill="${g.c}"/>`});
    const d=new Date(m0+i*7*DAY);s+=`<text x="${(x+w/2).toFixed(1)}" y="${H-7}" text-anchor="middle"${i===n-1?' style="fill:var(--ink);font-weight:600"':''}>${d.getDate()}/${d.getMonth()+1}</text>`});
  return s+'</svg>'+`<div class="legend">${GROUPS.map(g=>`<span style="--gc:${g.c}">${g.n}</span>`).join('')}</div>`;
}
function lineChart(pts,color='var(--c-chest)'){
  const W=330,H=160,p={l:28,r:16,t:18,b:24};
  const ys=pts.map(p=>p.y),mx=Math.max(...ys),mn=Math.min(...ys);
  const top=Math.ceil((mx+5)/10)*10,bot=Math.max(0,Math.floor((mn-5)/10)*10);
  const X=i=>p.l+(W-p.l-p.r)*(i/Math.max(1,pts.length-1));
  const Y=v=>p.t+(H-p.t-p.b)*(1-(v-bot)/((top-bot)||1));
  const d=pts.map((q,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(q.y).toFixed(1)).join(' ');
  const area=d+` L${X(pts.length-1).toFixed(1)} ${Y(bot)} L${X(0).toFixed(1)} ${Y(bot)} Z`;
  const li=pts.length-1,gid='lg'+Math.random().toString(36).slice(2,7);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Tổng rep push-up chính theo buổi">
   <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".35"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
   ${[bot,Math.round((bot+top)/2),top].map(t=>`<line x1="${p.l}" x2="${W-p.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)"/><text x="${p.l-6}" y="${Y(t)+4}" text-anchor="end">${t}</text>`).join('')}
   <path d="${area}" fill="url(#${gid})"/>
   <path d="${d}" fill="none" stroke="${color}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
   ${pts.map((q,i)=>`<circle cx="${X(i)}" cy="${Y(q.y)}" r="${i===li?5.5:3}" fill="${i===li?color:'var(--surface)'}" stroke="${color}" stroke-width="2"/>`).join('')}
   <text x="${X(li)}" y="${Y(pts[li].y)-11}" text-anchor="middle" style="fill:var(--ink);font-weight:700;font-size:12px">${pts[li].y}</text>
   <text x="${X(0)}" y="${H-7}" text-anchor="start">${esc(pts[0].x)}</text><text x="${X(li)}" y="${H-7}" text-anchor="end">${esc(pts[li].x)}</text></svg>`;
}
function testBars(first,last){
  const rows=[['maxPush','Push-up tối đa','rep','var(--c-chest)'],['plankMax','Plank','giây','var(--c-core)'],['squat60','Squat 60 giây','rep','var(--c-legs)']];
  return rows.map(([k,n,u,c])=>{const a=first&&first.test?first.test[k]:null,b=last&&last.test?last.test[k]:null;

/* ============ Progression flags ============ */
function pendingFlags(){
  const out=[];
  for(const id of Object.keys(EX)){
    if(!EX[id].lib)continue;
    const last=[...S.sessions].reverse().find(s=>s.sets.some(x=>x.ex===id&&!x.test));
    if(!last)continue;
    if(((last.lvl||{})[id]??0)!==lvl(id))continue;
    const sets=last.sets.filter(x=>x.ex===id&&!x.test);
    if(sets.length&&sets.length>=(sets[0].of||1)&&sets.every(x=>x.hi&&x.reps>=x.hi))out.push(id);
  }
  return out;
}

/* ============ Audio & wake lock ============ */
let actx=null;
function unlockAudio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();beep(880,0.001,0.0001)}catch(_){}}
function beep(f=880,dur=0.12,vol=0.25){
  if(!S.sound||!actx)return;
  try{const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=f;
    const t=actx.currentTime;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g).connect(actx.destination);o.start(t);o.stop(t+dur+0.02)}catch(_){}
}
let wake=null;
async function keepAwake(){try{if('wakeLock' in navigator&&!wake){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>{wake=null})}}catch(_){}}
function releaseWake(){try{wake&&wake.release()}catch(_){}wake=null}

/* ============ Player ============ */
let P=null;
const PH={work:'Tập',rest:'Nghỉ',transit:'Chuyển bài',warm:'Khởi động',stretch:'Giãn cơ',prep:'Chuẩn bị'};

function startSession(k){
  unlockAudio();keepAwake();
  P={k,steps:SESS[k].steps(),i:0,start:Date.now(),log:{},wd:[],paused:false,endAt:0,remain:0,watchStart:0,tick:null,sheet:false};
  $('#player').hidden=false;document.body.style.overflow='hidden';
  enterStep(0);
  P.tick=setInterval(tick,200);
}
function defaultReps(st){
  const key=st.ex+'#'+st.set;
  if(P.log[key]!=null)return P.log[key];
  const pv=prevReps(st.ex,st.set);if(pv!=null)return pv;
  return st.test?20:st.hi;
}
function prevReps(ex,set){
  const prev=[...S.sessions].reverse().find(s=>s.sets.some(x=>x.ex===ex&&x.set===set));
  if(prev&&((prev.lvl||{})[ex]??0)===lvl(ex)){const x=prev.sets.find(x=>x.ex===ex&&x.set===set);if(x)return x.reps}
  return null;
}
function enterStep(i){
  P.i=Math.max(0,Math.min(i,P.steps.length-1));
  const st=P.steps[P.i];
  P.paused=false;P.lastBeep=null;
  if(st.t==='timer'){P.total=st.secs;P.remain=st.secs;P.endAt=Date.now()+st.secs*1000}
  if(st.t==='watch'){P.watchStart=0}
  if(st.t==='reps'){P.cur=defaultReps(st)}
  drawPlayer();
}
function nextExStep(){for(let j=P.i+1;j<P.steps.length;j++)if(P.steps[j].ex)return P.steps[j];return null}
function stepInfo(s){if(!s)return '';if(s.t==='reps')return s.test?'tối đa':`Hiệp ${s.set}/${s.of} · ${s.lo===s.hi?s.hi:s.lo+'–'+s.hi} rep`;if(s.t==='watch')return 'bấm giờ';return (s.set&&!s.fin?`Hiệp ${s.set}/${s.of} · `:'')+s.secs+' giây'+(s.side?' · '+s.side:'')}
function drawPlayer(){
  const st=P.steps[P.i],el=$('#player');
  const phase=st.phase||'work';el.dataset.phase=phase;
  const isBreak=!st.ex,nx=nextExStep();
  const figId=st.ex||(nx&&nx.ex)||'standard';
  const prog=Math.round(P.i/(P.steps.length-1)*100);
  const tagline=st.tag?`${st.tag} · `:'';
  let title,sub,body='';
  if(isBreak){title=st.label;sub=nx?`Tiếp theo: <b>${esc(exName(nx.ex))}</b>`:'Sắp xong'}
  else{title=exName(st.ex);sub=esc(tagline+stepInfo(st))}
  if(st.t==='timer'){
    body=`<div class="bigtime" id="tt">${mmss(st.secs)}</div><div class="tbar"><i id="tb"></i></div>${phase==='rest'||phase==='transit'||phase==='prep'?`<div class="row" style="justify-content:center"><button class="btn mini" id="p-add">+15 giây</button></div>`:''}`;
  } else if(st.t==='watch'){
    body=`<div class="bigtime" id="tt">0:00</div><button class="btn btn-primary" id="w-btn" style="min-width:220px">Bắt đầu bấm giờ</button>`;
  } else {
    const sets=P.steps.filter(s=>s.t==='reps'&&s.ex===st.ex);
    const rows=st.test?'':`<div class="sets">${sets.map(s=>{const k=s.ex+'#'+s.set,done=P.log[k]!=null&&s!==st,cur=s===st,pv=prevReps(s.ex,s.set);
      return `<div class="set${done?' done':''}${cur?' cur':''}"><span class="n">${done?IC.check.replace('<svg','<svg width="14" height="14"'):s.set}</span><span class="v num">${done?P.log[k]+' rep':cur?'Đang tập':(s.lo+'–'+s.hi)+' rep'}</span><span class="h num">${pv!=null?'lần trước '+pv:''}</span></div>`}).join('')}</div>`;
    body=`${rows}<div class="reps"><button id="r-minus" aria-label="Bớt 1">−</button><output id="r-val">${P.cur}</output><button id="r-plus" aria-label="Thêm 1">+</button></div>`;
    sub=st.test?esc(st.ask||'Nhập số rep đã làm'):`${esc(tagline)}Hiệp ${st.set}/${st.of} · mục tiêu <b class="num">${st.lo===st.hi?st.hi:st.lo+'–'+st.hi}</b> rep${st.unit?' '+st.unit:''}`;
  }
  const mainBtn=st.t==='reps'?`<button class="btn btn-primary" id="p-done">${IC.check} Xong hiệp</button>`:
     st.t==='watch'?`<button class="btn btn-ghost" id="p-next2">Bỏ qua</button>`:
     `<button class="btn btn-primary" id="p-pause">${P.paused?IC.play+' Tiếp tục':IC.pause+' Tạm dừng'}</button>`;
  el.innerHTML=`<div class="pinner">
    <div class="ptop"><button class="iconbtn" id="p-close" aria-label="Kết thúc">${IC.x}</button>
      <div class="ttl"><b>${SESS[P.k].name}</b><span class="num" id="p-el">0:00</span></div><div class="num muted" style="width:44px;text-align:right;font-size:.85rem">${P.i+1}/${P.steps.length}</div></div>
    <div class="pprog"><i style="width:${prog}%"></i></div>
    <div class="pfig">${figHTML(figId)}<div class="ov"><span class="phase">${PH[phase]}</span></div></div>${isBreak&&nx?`<div class="pnx">Tiếp theo · <b>${esc(stepInfo(nx))}</b></div>`:(!isBreak&&st.t!=='reps'&&EX[st.ex].cue?`<div class="pnx">${esc(cue1(st.ex))}</div>`:'')}
    <div class="pbody"><div class="pname">${esc(title)}</div><div class="psub">${sub}</div>${body}</div>
    <div class="pctl"><button class="btn btn-ghost" id="p-prev" aria-label="Lùi lại">${IC.back}</button>${mainBtn}<button class="btn btn-ghost" id="p-next" aria-label="Bỏ qua">${IC.next}</button></div>
    ${P.sheet?`<div class="sheet"><h3>Kết thúc buổi tập?</h3><p class="muted">Các hiệp đã nhập vẫn được lưu nếu anh chọn lưu.</p>
      <button class="btn btn-primary" id="s-save">Lưu và kết thúc</button><button class="btn btn-line" id="s-discard">Bỏ, không lưu</button><button class="btn btn-ghost" id="s-cancel">Tập tiếp</button></div>`:''}</div>`;
  mountFigs(el);tick();
}
function tick(){
  if(!P||P.done)return;
  const el=$('#p-el');if(el)el.textContent=mmss((Date.now()-P.start)/1000);
  const st=P.steps[P.i];
  if(st.t==='timer'){
    const rem=P.paused?P.remain:(P.endAt-Date.now())/1000;
    const tt=$('#tt');if(tt)tt.textContent=mmss(rem);
    const tb=$('#tb');if(tb)tb.style.width=(100*(1-Math.max(0,rem)/P.total)).toFixed(1)+'%';
    if(!P.paused){
      const c=Math.ceil(rem);
      if(c<=3&&c>=1&&P.lastBeep!==c&&st.secs>5){P.lastBeep=c;beep(660,0.1)}
      if(rem<=0){beep(st.phase==='work'?520:990,0.35,0.3);if(st.phase==='work'&&st.ex&&!st.test)P.wd.push(st.ex);advance()}
    }
  } else if(st.t==='watch'&&P.watchStart){
    const tt=$('#tt');if(tt)tt.textContent=mmss((Date.now()-P.watchStart)/1000-0.5);
  }
}
function advance(){if(P.i>=P.steps.length-1){finish();return}enterStep(P.i+1)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&P){keepAwake();if(actx&&actx.state==='suspended')actx.resume();tick()}});

$('#player').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||!P)return;
  const st=P.steps[P.i];
  if(b.dataset.up){const id=b.dataset.up;S.level[id]=lvl(id)+1;save();b.outerHTML='<span>Đã lên bậc: <b>'+esc(exName(id))+'</b></span>';return}
  switch(b.id){
    case 'r-minus':P.cur=Math.max(0,P.cur-1);$('#r-val').textContent=P.cur;break;
    case 'r-plus':P.cur=P.cur+1;$('#r-val').textContent=P.cur;break;
    case 'p-done':P.log[st.ex+'#'+st.set]=P.cur;beep(990,0.12);advance();break;
    case 'p-pause':
      if(P.paused){P.paused=false;P.endAt=Date.now()+P.remain*1000}else{P.paused=true;P.remain=Math.max(0,(P.endAt-Date.now())/1000)}
      drawPlayer();break;
    case 'p-add':if(P.paused)P.remain+=15;else P.endAt+=15000;P.total+=15;P.lastBeep=null;tick();break;
    case 'p-prev':enterStep(P.i-1);break;
    case 'p-next':case 'p-next2':advance();break;
    case 'w-btn':
      if(!P.watchStart){P.watchStart=Date.now();b.textContent='Dừng';beep(880,0.1)}
      else{P.log[st.ex+'#1']=Math.round((Date.now()-P.watchStart)/1000);beep(990,0.2);advance()}
      break;
    case 'p-close':P.sheet=true;drawPlayer();break;
    case 's-cancel':P.sheet=false;drawPlayer();break;
    case 's-discard':closePlayer();break;
    case 's-save':finish();break;
    case 'sum-close':closePlayer();break;
  }
});

function finish(){
  const dur=Math.round((Date.now()-P.start)/1000);
  const sets=[];const test={};
  for(const st of P.steps){
    if(!(st.t==='reps'||st.t==='watch'))continue;
    const key=st.ex+'#'+(st.set||1);if(P.log[key]==null)continue;
    if(sets.some(x=>x.ex===st.ex&&x.set===(st.set||1)))continue;
    const rec={ex:st.ex,name:exName(st.ex),set:st.set||1,reps:P.log[key],hi:st.hi||0,of:st.of||1,unit:st.t==='watch'?'s':''};
    if(st.test||st.t==='watch'){rec.test=true;test[st.ex]=P.log[key]}
    sets.push(rec);
  }
  const lv={};Object.keys(EX).forEach(id=>{if(EX[id].variants)lv[id]=lvl(id)});
  const vol={};const addv=ex=>{const g=GOF[ex];if(g)vol[g]=(vol[g]||0)+1};
  sets.forEach(x=>{if(!x.test)addv(x.ex)});P.wd.forEach(addv);
  const sess={type:P.k,date:Date.now(),dur,sets,lvl:lv,vol};
  if(Object.keys(test).length)sess.test=test;
  if(!S.startDate||(P.k==='T'&&cycleWeek()>=8))S.startDate=Date.now();
  S.sessions.push(sess);save();
  clearInterval(P.tick);P.tick=null;releaseWake();P.done=true;
  const flags=pendingFlags().filter(id=>sets.some(x=>x.ex===id));
  const total=sets.filter(x=>x.unit!=='s').reduce((a,x)=>a+x.reps,0);
  const el=$('#player');el.dataset.phase='work';
  el.innerHTML=`<div class="pinner" style="overflow:auto"><div class="stack" style="padding-block:8px 16px">
    <div><div class="eyebrow">Hoàn thành · ${fmtDate(sess.date)}</div><h1 style="font-size:2.6rem">Tốt lắm, ${esc(S.name||'Michael')}!</h1><p class="muted" style="margin-top:4px">${SESS[P.k].name}</p></div>
    <div class="stats"><div class="stat"><b class="num">${mmss(dur)}</b><span>thời gian</span></div><div class="stat"><b class="num">${sets.filter(x=>!x.test).length}</b><span>hiệp có ghi</span></div><div class="stat"><b class="num">${total}</b><span>tổng rep</span></div></div>
    ${sess.test?`<div class="card"><div class="eyebrow">Kết quả kiểm tra</div><p style="margin-top:6px" class="num">Push-up: <b>${test.maxPush??'–'}</b> · Plank: <b>${test.plankMax??'–'} giây</b> · Squat 60s: <b>${test.squat60??'–'}</b></p></div>`:''}
    ${flags.map(id=>{const e=EX[id],nx=e.variants&&lvl(id)<e.variants.length-1?e.variants[lvl(id)+1]:null;
      return `<div class="flag"><b>${esc(exName(id))}: đủ rep tối đa mọi hiệp</b><span>${esc(e.harder||'Buổi sau tăng độ khó.')}</span>${nx?`<button class="btn btn-primary" data-up="${id}">Lên bậc: ${esc(nx)}</button>`:''}</div>`}).join('')}
    ${!sess.test&&!flags.length?'<p class="muted">Buổi sau cố thêm 1 rep ở mỗi hiệp so với hôm nay.</p>':''}
    ${histCard(sess)}
  </div></div><div style="max-width:560px;width:100%;margin:0 auto"><button class="btn btn-primary btn-block" id="sum-close">Xong</button></div>`;
  mountFigs(el);
}
function closePlayer(){if(P&&P.tick)clearInterval(P.tick);P=null;releaseWake();$('#player').hidden=true;$('#player').innerHTML='';document.body.style.overflow='';render()}

render();
</script>

<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}</script>
</body></html>
